<title>Logo Santander</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: columna de parámetros agrupados por bloque a la izquierda; lienzo blanco con el logo y texto de defensa debajo. */
:root {
  --bg: #f3f1f1;
  --surface: #ffffff;
  --ink: #1e1a1a;
  --muted: #6a6262;
  --line: #ddd6d6;
  --accent: #c9000f;
  --accent-ink: #ffffff;
  --canvas: #ffffff;
  --c-ink: #1e1a1a;
  --c-line: #e3dddd;
  --f-display: 'Bricolage Grotesque', 'Trebuchet MS', sans-serif;
  --f-body: 'Instrument Sans', system-ui, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131010; --surface: #1c1818; --ink: #f1eded; --muted: #a59b9b; --line: #342d2d;
    --accent: #ff4d57; --accent-ink: #1a0b0c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131010; --surface: #1c1818; --ink: #f1eded; --muted: #a59b9b; --line: #342d2d;
  --accent: #ff4d57; --accent-ink: #1a0b0c; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; padding-inline: 16px; padding-block: 16px; }
.app { max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: 232px minmax(0, 1fr); gap: 22px; align-items: start; }
.side { min-width: 0; }
.kick { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px; }
h1 { font-family: var(--f-display); font-size: 26px; line-height: 1.1; margin: 0 0 16px; font-weight: 700; text-wrap: balance; }
.grp { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 14px 0 6px; padding-top: 10px; border-top: 1px solid var(--line); }
.list { display: flex; flex-direction: column; gap: 3px; }
.p { appearance: none; border: 1px solid transparent; background: transparent; color: var(--ink); font: inherit; text-align: left; padding: 7px 10px; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.p:hover { background: var(--surface); border-color: var(--line); }
.p[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.p .r { font-family: var(--f-mono); font-size: 10.5px; opacity: .75; white-space: nowrap; }
.p:focus-visible, .seg button:focus-visible, summary:focus-visible, input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; }
details { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 10px; }
summary { cursor: pointer; font-weight: 600; font-size: 14px; }
.up { display: grid; gap: 8px; margin-top: 10px; }
.up label { display: block; font-size: 12.5px; color: var(--muted); }
.up input[type=file] { display: block; width: 100%; font-size: 12px; margin-top: 3px; color: var(--ink); }
.main { min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.stage { background: var(--canvas); border: 1px solid var(--c-line); border-radius: 12px; padding: 16px; min-height: 340px; display: flex; flex-direction: column; gap: 12px; color: var(--c-ink); }
.view { flex: 1; min-height: 240px; display: grid; place-items: center; min-width: 0; }
.view img { max-width: 100%; height: auto; display: block; }
.ctl { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center; font-size: 13px; }
.ctl input[type=range] { width: min(320px, 70vw); accent-color: #c9000f; }
.ctl output { font-family: var(--f-mono); font-size: 12px; min-width: 56px; }
.seg { display: inline-flex; border: 1px solid var(--c-line); border-radius: 999px; padding: 3px; gap: 2px; flex-wrap: wrap; justify-content: center; }
.seg button { appearance: none; border: 0; background: transparent; font: inherit; font-size: 13px; padding: 5px 14px; border-radius: 999px; cursor: pointer; color: var(--c-ink); }
.seg button[aria-pressed="true"] { background: #c9000f; color: #fff; }
.note { font-size: 12px; color: #6a6262; text-align: center; margin: 0; }
.tiles { display: grid; gap: 10px; width: 100%; }
.tiles.c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.tiles.c5 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.tile { border: 1px solid var(--c-line); border-radius: 10px; min-height: 130px; display: grid; place-items: center; position: relative; padding: 14px 10px 30px; overflow: hidden; }
.tile .cap { position: absolute; left: 0; right: 0; bottom: 7px; text-align: center; font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .05em; text-transform: uppercase; color: #6a6262; }
.tile.dark .cap, .tile.red .cap { color: rgba(255,255,255,.8); }
.tile img.lg { max-width: 82%; max-height: 62px; width: auto; height: auto; }
.tile.dark { background: #232020; border-color: #232020; }
.tile.red { background: #c9000f; border-color: #c9000f; }
.tile.teal { background: #0f6b6b; border-color: #0f6b6b; }
.wht { filter: brightness(0) invert(1); }
.blk { filter: brightness(0); }
.mock { position: relative; width: 150px; height: 120px; }
.mock svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.mock img { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
.cmp { position: relative; width: min(420px, 100%); aspect-ratio: 16 / 9; border: 1px solid var(--c-line); border-radius: 10px; overflow: hidden; background: #fff; }
.cmp .layer { position: absolute; inset: 0; display: grid; place-items: center; padding: 20px; }
.cmp .layer img { max-height: 70%; max-width: 80%; }
.cmp .top { background: #fff; }
.cmp .bot { background: #f4f4f4; }
.cmp .tag { position: absolute; top: 8px; font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; background: #1e1a1a; color: #fff; padding: 2px 7px; border-radius: 4px; z-index: 2; }
.cmp .tag.l { left: 8px; } .cmp .tag.r { right: 8px; }
.cmp .bar { position: absolute; top: 0; bottom: 0; width: 2px; background: #c9000f; z-index: 3; pointer-events: none; }
.page { width: min(440px, 100%); border: 1px solid var(--c-line); border-radius: 10px; padding: 12px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.page .b { background: #e8e8ea; border-radius: 6px; height: 54px; }
.page .b.t { height: 54px; background: #d9d9dd; }
.page .lg { grid-column: span 1; display: grid; place-items: center; background: #fff; border: 1px dashed #cfcfd3; border-radius: 6px; height: 54px; }
.page .lg img { max-width: 80%; max-height: 38px; width: auto; transition: filter .25s; }
.q { text-align: center; }
.q .big { font-family: var(--f-display); font-size: 22px; font-weight: 700; margin: 8px 0 0; }
.sym { width: 120px; }
.appicon { width: 92px; height: 92px; border-radius: 22px; border: 1px solid var(--c-line); box-shadow: 0 6px 16px rgba(0,0,0,.12); display: grid; place-items: center; background: #fff; }
.appicon img { width: 56%; }
.tabstrip { width: 200px; border: 1px solid var(--c-line); border-radius: 8px 8px 0 0; border-bottom: 0; background: #f1f1f3; padding: 6px 10px; display: flex; align-items: center; gap: 8px; font-size: 12px; color: #6a6262; }
.tabstrip img { width: 16px; height: 16px; object-fit: contain; }
.masked { display: inline-block; }
.masked img { visibility: hidden; }
.photos { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; width: 100%; }
.photos img { width: 100%; height: 160px; object-fit: cover; border-radius: 10px; }
.copy { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
.copy h2 { font-family: var(--f-display); font-size: 22px; margin: 0 0 6px; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.chip { font-family: var(--f-mono); font-size: 11px; letter-spacing: .05em; text-transform: uppercase; border: 1px solid var(--accent); color: var(--accent); padding: 1px 8px; border-radius: 999px; font-weight: 500; }
.copy p { margin: 0; max-width: 68ch; }
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .list { flex-direction: row; flex-wrap: wrap; }
  .p { border-color: var(--line); }
  .p .r { display: none; }
  .tiles.c3, .tiles.c5 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <aside class="side">
    <p class="kick">Chaves y Belluccia</p>
    <h1>Logo Santander: 11 parámetros</h1>
    <div id="nav"></div>
    <details id="uploads" hidden>
      <summary>Cargar imágenes</summary>
      <div class="up">
        <div><label for="f-nuevo">Logo nuevo (PNG con fondo transparente o SVG)</label><input id="f-nuevo" type="file" accept="image/*"></div>
        <div><label for="f-antiguo">Logo antiguo</label><input id="f-antiguo" type="file" accept="image/*"></div>
        <div><label for="f-simbolo">Solo el símbolo (la llama)</label><input id="f-simbolo" type="file" accept="image/*"></div>
        <div><label for="f-competidores">Logos de competidores</label><input id="f-competidores" type="file" accept="image/*" multiple></div>
        <div><label for="f-fotos">Fotos de 8M y Orgullo</label><input id="f-fotos" type="file" accept="image/*" multiple></div>
      </div>
    </details>
  </aside>
  <main class="main">
    <section class="stage" aria-live="polite">
      <div class="view" id="view"></div>
      <div id="ctl"></div>
      <p class="note" id="note" hidden></p>
    </section>
    <section class="copy">
      <h2><span id="ctitle"></span><span class="chip" id="crate"></span></h2>
      <p id="ctext"></p>
    </section>
  </main>
</div>

    ['#0b3d91', 'BANCO A'], ['#0072ce', 'BANCO B'], ['#12467a', 'BANCO C'], ['#2e7d32', 'BANCO D']
  ].map(([c, t]) => svgURI('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90"><rect x="4" y="12" width="312" height="66" rx="10" fill="' + c + '"/><text x="160" y="56" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="32" fill="#fff">' + t + '</text></svg>')),

const up = {};
const get = k => up[k] || ASSETS[k] || PH[k];
const getList = k => (up[k] && up[k].length) ? up[k] : (ASSETS[k] && ASSETS[k].length) ? ASSETS[k] : PH[k];
const isPH = k => Array.isArray(PH[k]) ? !((up[k] && up[k].length) || (ASSETS[k] && ASSETS[k].length)) : !(up[k] || ASSETS[k]);

const P = [
  { id: 'legibilidad', n: 'Legibilidad', b: 1, r: 'Alta', t: 'La tipografía es moderna, ancha y de trazo uniforme, y el nombre se lee con facilidad incluso a tamaños pequeños. No creemos que la «a» se confunda con la «o»: el trazo recto de la «a» las distingue con claridad y la pregnancia del conjunto hace que el nombre se reconozca de un vistazo.' },
  { id: 'reproducibilidad', n: 'Reproducibilidad', b: 1, r: 'Alta', t: 'Sin degradados ni detalles finos, el logo mantiene su identidad en versión positiva, monocroma y negativa. El logo antiguo, con letras finas sobre fondo rojo, perdía definición al reducirse o pasarse a una sola tinta. El nuevo está pensado para pantallas, aplicaciones y cualquier soporte. El fondo blanco no forma parte del logo: es el espacio sobre el que se coloca.' },
  { id: 'versatilidad', n: 'Versatilidad', b: 1, r: 'Alta', t: 'Al no tener detalles pequeños, el logo no pierde información al cambiar de tamaño o de soporte. Funciona igual en una taza, una camiseta o una app. Su sencillez es lo que permite este juego.' },
  { id: 'declinabilidad', n: 'Declinabilidad', b: 1, r: 'Alta', t: 'Esa versatilidad permite adaptar el logo a fechas señaladas, como el 8M o el Día del Orgullo. Con letras gruesas y redondeadas sobre fondo blanco, admite cambios de color sin perder fuerza. Con el logo antiguo, de letras finas y fondo rojo, estas adaptaciones habrían sido mucho más difíciles.' },
  { id: 'vigencia', n: 'Vigencia', b: 1, r: 'Alta', t: 'La tipografía redondeada y de trazo grueso responde al estándar actual de las marcas en entornos digitales. El logo antiguo transmitía una imagen más rígida; el nuevo comunica una empresa que se adapta a los tiempos y no se queda obsoleta.' },
  { id: 'pregnancia', n: 'Pregnancia', b: 2, r: 'Alta', t: 'El logo es muy sencillo y se reconoce de forma casi inmediata, incluso desenfocado o reducido a silueta. Además, el rojo de las letras resalta más que si el rojo estuviera en el fondo, algo que se aprecia sobre todo al pasarlo a blanco y negro o a medios digitales.' },
  { id: 'vocatividad', n: 'Vocatividad', b: 2, r: 'Alta', t: 'El rojo, aplicado a las letras y al símbolo, atrae la atención. Sobre el fondo blanco, el contraste hace que el nombre del banco destaque sin esfuerzo entre otros elementos.' },
  { id: 'singularidad', n: 'Singularidad', b: 2, r: 'Alta', t: 'La mayoría de los bancos competidores apuestan por el azul. Un banco rojo es la excepción del sector, y por eso resulta difícil pensar en una entidad financiera roja sin que venga a la mente Santander.' },
  { id: 'suficiencia', n: 'Suficiencia', b: 2, r: 'Alta', t: 'El logo no necesita nada más para ser identificable. El símbolo, el nombre y el color bastan para reconocer la marca, incluso en espacios muy reducidos, como el icono de una aplicación o la pestaña de un navegador.' },
  { id: 'pertinencia', n: 'Pertinencia', b: 3, r: 'Media', t: 'La actividad bancaria no tiene un referente visual propio que no sea un cliché, y Santander lo evita con la llama, símbolo de energía, evolución y progreso. El rojo aporta solidez y determinación, valores que se exigen a quien custodia nuestro dinero. Reconocemos que, vista por primera vez, la llama podría asociarse a otro sector. Por eso la valoramos como media.' },
  { id: 'inteligibilidad', n: 'Inteligibilidad', b: 3, r: 'Media-baja', t: 'Si se borrase la memoria de los consumidores, probablemente no relacionarían la llama con un banco: la asociación existe porque la empresa la ha reforzado durante años. Pero esto afecta por igual al logo antiguo y al nuevo, así que el cambio no empeora este parámetro. Además, el nuevo logo deja el nombre muy claro, y es ese nombre el que ancla el significado.' }
];
const BLOCKS = { 1: 'Lo que mejora el diseño', 2: 'Frente a la competencia', 3: 'Los puntos débiles' };

const st = { leg: 56, blur: 0, sil: false, vig: 50, voc: 'color', per: 'completo', dec: 'orig', int: 'simbolo' };
const $ = s => document.querySelector(s);
const view = $('#view'), ctl = $('#ctl'), note = $('#note');
let cur = 'legibilidad';

const seg = (key, opts) => '<div class="seg" role="group">' + opts.map(([v, l]) => '<button type="button" data-v="' + v + '" aria-pressed="' + (st[key] === v) + '">' + l + '</button>').join('') + '</div>';
function bindSeg(key, again) {
  ctl.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => { st[key] = b.dataset.v; again(); }));
}
function slider(id, label, min, max, val, unit) {
  return '<label for="' + id + '">' + label + '</label><input id="' + id + '" type="range" min="' + min + '" max="' + max + '" value="' + val + '"><output id="' + id + 'o">' + val + unit + '</output>';
}

const R = {
  legibilidad() {
    view.innerHTML = '<img id="im" src="' + get('nuevo') + '" style="width:' + st.leg + 'px" alt="Logo nuevo">';
    ctl.innerHTML = '<div class="ctl">' + slider('rg', 'Tamaño', 12, 300, st.leg, ' px') + '</div>';
    $('#rg').addEventListener('input', e => { st.leg = +e.target.value; $('#im').style.width = st.leg + 'px'; $('#rgo').textContent = st.leg + ' px'; });
    setNote('Arrastra hacia la izquierda: el nombre se sigue leyendo.');
  },
  reproducibilidad() {
    const l = get('nuevo');
    view.innerHTML = '<div class="tiles c3">' +
      '<div class="tile"><img class="lg" src="' + l + '" alt=""><span class="cap">Positiva</span></div>' +
      '<div class="tile"><img class="lg blk" src="' + l + '" alt=""><span class="cap">Monocroma</span></div>' +
      '<div class="tile red"><img class="lg wht" src="' + l + '" alt=""><span class="cap">Negativa</span></div></div>';
    ctl.innerHTML = '';
    setNote('Tres versiones del mismo logo, sin perder reconocimiento.');
  },
  versatilidad() {
    const l = get('nuevo');
    const mug = '<div class="mock"><svg viewBox="0 0 150 120"><path d="M112 34h10a14 14 0 0 1 0 38h-10" fill="none" stroke="#c9c9cf" stroke-width="7"/><rect x="22" y="12" width="92" height="96" rx="12" fill="#f4f4f6" stroke="#c9c9cf" stroke-width="2"/></svg><img src="' + l + '" style="width:62px" alt=""></div>';
    const shirt = '<div class="mock"><svg viewBox="0 0 150 120"><path d="M48 8 20 22 8 48l22 8 8-8v64h74V48l8 8 22-8-12-26-28-14q-27 22-54 0z" fill="#eceef2" stroke="#c9c9cf" stroke-width="2"/></svg><img src="' + l + '" style="width:48px;margin-top:-6px" alt=""></div>';
    view.innerHTML = '<div class="tiles c5">' +
      '<div class="tile"><img class="lg" src="' + l + '" alt=""><span class="cap">Fondo claro</span></div>' +
      '<div class="tile dark"><img class="lg wht" src="' + l + '" alt=""><span class="cap">Fondo oscuro</span></div>' +
      '<div class="tile teal"><img class="lg wht" src="' + l + '" alt=""><span class="cap">Fondo de color</span></div>' +
      '<div class="tile">' + mug + '<span class="cap">Taza</span></div>' +
      '<div class="tile">' + shirt + '<span class="cap">Camiseta</span></div></div>';
    ctl.innerHTML = '';
    setNote('El mismo logo en soportes muy distintos.');
  },
  declinabilidad() {
    const l = get('nuevo');
    const opts = [['orig', 'Original'], ['m8', '8M'], ['pride', 'Orgullo']];
    if (!isPH('fotos')) opts.push(['fotos', 'Vuestras fotos']);
    ctl.innerHTML = '<div class="ctl">' + seg('dec', opts) + '</div>';
    bindSeg('dec', R.declinabilidad);
    if (st.dec === 'fotos') {
      view.innerHTML = '<div class="photos">' + getList('fotos').map(s => '<img src="' + s + '" alt="Adaptación del logo">').join('') + '</div>';
      setNote('');
      return;
    }
    const own = up[st.dec] || ASSETS[st.dec];
    if (own) { view.innerHTML = '<img src="' + own + '" style="width:min(380px,88%)" alt="Logo adaptado">'; setNote(''); return; }
    const fill = st.dec === 'm8' ? '#7b2d8e' : st.dec === 'pride' ? 'linear-gradient(90deg,#e40303,#ff8c00,#ffed00,#008026,#004dff,#750787)' : '';
    if (!fill) { view.innerHTML = '<img src="' + l + '" style="width:min(380px,88%)" alt="">'; setNote(''); }
    else {
      view.innerHTML = '<div class="masked" style="width:min(380px,88%);background:' + fill + ';-webkit-mask:url(' + l + ') center/100% 100% no-repeat;mask:url(' + l + ') center/100% 100% no-repeat"><img src="' + l + '" alt="" style="width:100%"></div>';
      setNote('Recoloreado automático. Funciona mejor con PNG de fondo transparente.');
    }
  },
  vigencia() {
    const n = get('nuevo'), a = get('antiguo');
    view.innerHTML = '<div class="cmp" id="cmp"><div class="layer bot"><img src="' + a + '" alt="Logo antiguo"></div><div class="layer top" id="topl" style="clip-path:inset(0 ' + (100 - st.vig) + '% 0 0)"><img src="' + n + '" alt="Logo nuevo"></div><span class="tag l">Nuevo</span><span class="tag r">Antiguo</span><div class="bar" id="bar" style="left:' + st.vig + '%"></div></div>';
    ctl.innerHTML = '<div class="ctl"><label for="vg">Comparar</label><input id="vg" type="range" min="0" max="100" value="' + st.vig + '"></div>';
    $('#vg').addEventListener('input', e => { st.vig = +e.target.value; $('#topl').style.clipPath = 'inset(0 ' + (100 - st.vig) + '% 0 0)'; $('#bar').style.left = st.vig + '%'; });
    setNote(isPH('antiguo') ? '' : '');
  },
  pregnancia() {
    const f = () => 'filter:' + (st.sil ? 'brightness(0) ' : '') + 'blur(' + st.blur + 'px)';
    view.innerHTML = '<img id="im" src="' + get('nuevo') + '" style="width:min(320px,80%);' + f() + '" alt="">';
    ctl.innerHTML = '<div class="ctl">' + slider('bl', 'Desenfoque', 0, 14, st.blur, ' px') + seg('sil', [['0', 'Color'], ['1', 'Silueta']]) + '</div>';
    st.sil = st.sil ? true : false;
    ctl.querySelectorAll('.seg button').forEach(b => { b.setAttribute('aria-pressed', String((b.dataset.v === '1') === st.sil)); b.addEventListener('click', () => { st.sil = b.dataset.v === '1'; R.pregnancia(); }); });
    $('#bl').addEventListener('input', e => { st.blur = +e.target.value; $('#im').style.filter = (st.sil ? 'brightness(0) ' : '') + 'blur(' + st.blur + 'px)'; $('#blo').textContent = st.blur + ' px'; });
    setNote('¿Sigue siendo reconocible?');
  },
  vocatividad() {
    const l = get('nuevo');
    const g = st.voc === 'gris' ? 'filter:grayscale(1)' : '';
    const blocks = ['b', 'b t', 'b', 'b t', 'lg', 'b', 'b', 'b t', 'b'];
    view.innerHTML = '<div class="page">' + blocks.map(c => c === 'lg' ? '<div class="lg"><img src="' + l + '" style="' + g + '" alt=""></div>' : '<div class="' + c + '"></div>').join('') + '</div>';
    ctl.innerHTML = '<div class="ctl">' + seg('voc', [['color', 'Color'], ['gris', 'Escala de grises']]) + '</div>';
    bindSeg('voc', R.vocatividad);
    setNote('¿Dónde va primero la mirada?');
  },
  singularidad() {
    const comp = getList('competidores').slice(0, 5);
    const tiles = comp.map(s => '<div class="tile"><img class="lg" src="' + s + '" alt=""><span class="cap">Competidor</span></div>');
    tiles.splice(Math.floor(tiles.length / 2), 0, '<div class="tile" style="border-color:#c9000f;border-width:2px"><img class="lg" src="' + get('nuevo') + '" alt=""><span class="cap" style="color:#c9000f">Santander</span></div>');
    view.innerHTML = '<div class="tiles c5">' + tiles.join('') + '</div>';
    ctl.innerHTML = '';
    setNote(isPH('competidores') ? 'Competidores de ejemplo. Cargad los logos reales en «Cargar imágenes».' : '');
  },
  suficiencia() {
    const s = get('simbolo');
    view.innerHTML = '<div style="display:grid;gap:22px;justify-items:center"><div class="appicon"><img src="' + s + '" alt=""></div><div><div class="tabstrip"><img src="' + s + '" alt=""><span>Banca online</span></div><div style="height:6px;border-top:1px solid var(--c-line);width:200px"></div></div></div>';
    ctl.innerHTML = '';
    setNote(isPH('simbolo') ? 'Cargad el símbolo (la llama) para ver el efecto real.' : 'Sin el nombre, el símbolo ya identifica a la marca.');
  },
  pertinencia() {
    const solo = st.per === 'solo';
    view.innerHTML = '<img src="' + (solo ? get('simbolo') : get('nuevo')) + '" style="width:' + (solo ? 'min(150px,50%)' : 'min(320px,80%)') + '" alt="">';
    ctl.innerHTML = '<div class="ctl">' + seg('per', [['completo', 'Logo completo'], ['solo', 'Solo el símbolo']]) + '</div>';
    bindSeg('per', R.pertinencia);
    setNote(solo ? 'Visto por primera vez, ¿de qué sector parece?' : '');
  },
  inteligibilidad() {
    const solo = st.int === 'simbolo';
    view.innerHTML = solo ? '<div class="q"><img class="sym" src="' + get('simbolo') + '" alt=""><p class="big">¿De qué sector es?</p></div>' : '<div class="q"><img src="' + get('nuevo') + '" style="width:min(320px,80%)" alt=""><p class="big">El nombre ancla el significado</p></div>';
    ctl.innerHTML = '<div class="ctl">' + seg('int', [['simbolo', 'Sin memoria de marca'], ['nombre', 'Con el nombre']]) + '</div>';
    bindSeg('int', R.inteligibilidad);
    setNote('');
  }
};

function setNote(t) { note.textContent = t || ''; note.hidden = !t; }

function renderNav() {
  let h = '';
  [1, 2, 3].forEach(b => {
    h += '<div class="grp">' + BLOCKS[b] + '</div><div class="list">';
    P.filter(p => p.b === b).forEach(p => { h += '<button class="p" type="button" data-id="' + p.id + '" aria-pressed="' + (p.id === cur) + '"><span>' + p.n + '</span><span class="r">' + p.r + '</span></button>'; });
    h += '</div>';
  });
  $('#nav').innerHTML = h;
  $('#nav').querySelectorAll('.p').forEach(b => b.addEventListener('click', () => select(b.dataset.id)));
}
function select(id) {
  cur = id;
  const p = P.find(x => x.id === id);
  renderNav();
  $('#ctitle').textContent = p.n;
  $('#crate').textContent = 'Valoración: ' + p.r;
  $('#ctext').textContent = p.t;
  R[id]();
}

[['nuevo', 'f-nuevo'], ['antiguo', 'f-antiguo'], ['simbolo', 'f-simbolo']].forEach(([k, id]) => {
  $('#' + id).addEventListener('change', e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { up[k] = r.result; select(cur); }; r.readAsDataURL(f); });
});
[['competidores', 'f-competidores'], ['fotos', 'f-fotos']].forEach(([k, id]) => {
  $('#' + id).addEventListener('change', e => {
    const files = [...e.target.files]; if (!files.length) return;
    Promise.all(files.map(f => new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(f); }))).then(list => { up[k] = list; select(cur); });
  });
});

const h0 = (location.hash || '').replace('#', '');
select(P.some(p => p.id === h0) ? h0 : 'legibilidad');
</script>
